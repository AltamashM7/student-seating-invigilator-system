<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body>
<header class="topbar"><strong>Exam Planner</strong><span><span data-user-name></span> · <a href="#" onclick="logout()">Logout</a></span></header>
<div class="layout">
    <nav class="sidebar"><a href="dashboard.html">Dashboard</a><a href="create-user.html">Create User</a></nav>
    <main class="content">
        <h1>Create User</h1>
        <section class="panel">
            <form id="userForm" class="grid-form">
                <label>Name<input id="name" required></label>
                <label>Email<input id="email" type="email" required></label>
                <label>Username<input id="username" required></label>
                <label>Password<input id="password" type="password" required></label>
                <label>Role<select id="role"><option value="FACULTY">Faculty</option><option value="ADMIN">Administrator</option></select></label>
                <label id="employeeWrap">Employee Code<input id="employeeCode"></label>
                <div class="full"><p id="message" class="form-message"></p><button type="submit">Create Account</button></div>
            </form>
        </section>
    </main>
</div>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/guard.js"></script>
<script>
requireRole('ADMIN');
const role = document.getElementById('role');
const employeeWrap = document.getElementById('employeeWrap');
role.addEventListener('change', () => employeeWrap.style.display = role.value === 'FACULTY' ? 'grid' : 'none');
document.getElementById('userForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const message = document.getElementById('message');
    message.className = 'form-message';
    try {
        await apiRequest('../../api/auth/register', {
            method: 'POST',
            body: formBody({
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                role: role.value,
                employeeCode: document.getElementById('employeeCode').value
            })
        });
        message.classList.add('success');
        message.textContent = 'Account created';
        event.target.reset();
    } catch (error) {
        message.textContent = error.message;
    }
});
</script>
</body>
</html>
