<body data-shell="admin" data-resource="divisions" data-student-page="">

  <header data-app-header></header>
  <div class="workspace"><aside data-app-nav></aside>
  <main id="main" class="content" tabindex="-1">
<div class="breadcrumbs">Administration / Divisions</div><div class="page-heading"><div><h1 id="pageTitle">Divisions</h1><p>Organize each department into year-of-study groups and divisions.</p></div></div>
    <div class="toolbar"><label>Academic year<select id="academicYear" name="academicYear"></select></label><button id="newRecord" type="button">Add division</button></div>
    <p id="notice" role="status" hidden></p>
    <details class="editor" id="editor"><summary id="editorTitle">Add division</summary><div class="editor-body"><p class="helper-text" id="editorHelp"></p><form id="recordForm"><div id="fields" class="grid-form"></div><div class="toolbar form-actions"><button id="saveButton" type="submit">Save division</button><button id="clearButton" type="button" class="secondary">Cancel editing</button></div></form></div></details>
    <section class="panel"><div class="panel-heading"><h2>Divisions list</h2><button id="refreshButton" type="button" class="secondary">Refresh</button></div>
    <div class="list-toolbar"><label class="search-field">Search<input type="search" id="recordSearch" placeholder="Search names, codes or details…" autocomplete="off"></label><label>Department<select id="departmentFilter"><option value="">All departments</option></select></label><label>Study year<select id="studyFilter"><option value="">All years</option><option value="1">FY</option><option value="2">SY</option><option value="3">TY</option><option value="4">BE</option></select></label><label>Sort by<select id="sortBy"></select></label><label class="page-size">Per page<select id="pageSize"><option>25</option><option>50</option><option>100</option></select></label></div>
    <div class="table-wrap"><table><thead><tr id="tableHead"></tr></thead><tbody id="tableRows"></tbody></table></div><div class="list-meta"><span id="recordCount" role="status">Loading records…</span><div class="pager"><button id="previousPage" class="secondary" type="button">Previous</button><button id="nextPage" class="secondary" type="button">Next</button></div></div></section>

  </main>
