<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Planner - Login</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="auth-body">
<main class="auth-card">
    <div class="brand-mark">EP</div>
    <h1>Exam Planner</h1>
    <p class="muted">Exam seating and invigilation management</p>

    <form id="loginForm" class="stack-form">
        <label>Username
            <input id="username" name="username" autocomplete="username" required>
        </label>
        <label>Password
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="message" class="form-message"></p>
        <button type="submit">Login</button>
    </form>

    <div class="auth-links">
        <a href="pages/auth/forgot-password.html">Forgot password?</a>
        <a href="pages/student/dashboard.html">Student view</a>
    </div>
</main>
<script src="assets/js/api.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
