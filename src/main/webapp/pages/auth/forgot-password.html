<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body class="auth-body">
<main class="auth-card">
    <h1>Find your account</h1>
    <p class="muted">Enter the username and email registered with your account.</p>
    <form id="forgotForm" class="stack-form">
        <label>Username<input id="username" required></label>
        <label>Email<input id="email" type="email" required></label>
        <button type="submit">Continue</button>
    </form>
    <p><a href="../../index.html">Back to login</a></p>
</main>
<script>
document.getElementById('forgotForm').addEventListener('submit', (event) => {
    event.preventDefault();
    sessionStorage.setItem('resetUsername', document.getElementById('username').value.trim());
    sessionStorage.setItem('resetEmail', document.getElementById('email').value.trim());
    location.href = 'reset-password.html';
});
</script>
</body>
</html>
