<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203646"><title>Faculty availability | Exam Planner</title><link rel="stylesheet" href="../../assets/css/main.css?v=20261018-full1"><link rel="stylesheet" href="../../assets/css/ui.css?v=20261018-full1">  <link rel="stylesheet" href="../../demo.css?v=1">
</head>
<body data-shell="admin" data-planner="availability"><a class="skip-link" href="#main">Skip to content</a><header data-app-header></header><div class="workspace"><aside data-app-nav></aside><main id="main" class="content" tabindex="-1"><div class="breadcrumbs">Administration / Faculty availability</div><div class="page-heading"><div><h1>Faculty availability</h1><p>Maintain unavailable periods and invigilation eligibility.</p></div></div><p id="planningMessage" role="status" hidden></p><section class="panel"><div id="adminFacultyPicker" hidden><label>Faculty<select id="availabilityFaculty"></select></label></div><p id="availabilityDescription" class="helper-text"></p><form id="availabilitySettings" class="grid-form"><label class="check-label"><input type="checkbox" id="facultyAvailable">Available for invigilation</label><label id="dailyLimitLabel">Maximum duties per day<input type="number" id="maxDaily" min="1" max="20" required></label><label id="totalLimitLabel">Maximum duties per academic year<input type="number" id="maxTotal" min="1" max="500" required></label><button type="submit" id="saveAvailability">Save eligibility</button></form><p class="helper-text">To change availability during an assigned active duty, decline or reassign that duty first.</p></section><section class="panel"><h2>Unavailable time</h2><form id="unavailableForm" class="grid-form"><label>Date<input type="date" id="unavailableDate" required></label><label>From<input type="time" id="unavailableStart" required></label><label>To<input type="time" id="unavailableEnd" required></label><label>Reason<input id="unavailableReason" maxlength="250" required></label><button type="submit" id="addUnavailable">Add unavailable period</button></form><div class="list-toolbar"><label class="search-field">Search<input id="planningSearch" type="search" placeholder="Search records…" autocomplete="off"></label><label>Rows<select id="planningSize"><option>25</option><option>50</option><option>100</option></select></label></div><div class="table-wrap"><table><thead id="planningHead"></thead><tbody id="planningRows"></tbody></table></div><div class="list-meta"><span id="planningCount" role="status"></span><div class="pager"><button id="planningPrevious" class="secondary" type="button">Previous</button><button id="planningNext" class="secondary" type="button">Next</button></div></div></section><section class="panel" id="policyPanel" hidden><h2>Assignment rules</h2><form id="policyForm" class="grid-form"><label>Rest between duties (minutes)<input id="restMinutes" type="number" min="0" max="240" required></label><label>Seated students per invigilator<input id="studentsPerInvigilator" type="number" min="1" max="500" required></label><label class="check-label"><input id="avoidOwnDepartment" type="checkbox">Exclude faculty from their own department's courses</label><button id="savePolicy" type="submit">Save rules</button></form><details class="editor"><summary>Teaching and course conflicts</summary><div class="editor-body"><form id="courseConflictForm" class="grid-form"><label>Course<select id="conflictCourse" required></select></label><label class="check-label"><input id="courseExcluded" type="checkbox">Selected faculty teaches or has a conflict with this course</label><button type="submit" id="saveCourseConflict">Save course conflict</button></form><p id="courseConflictSummary" class="helper-text"></p></div></details></section><dialog id="planningDialog" aria-labelledby="dialogTitle"><form id="dialogForm"><h2 id="dialogTitle"></h2><div id="dialogDetails" class="preview-changes"></div><label>Reason<input id="dialogReason" required maxlength="250" autocomplete="off"></label><label id="replaceAckLabel" class="check-label" hidden><input id="replaceAck" type="checkbox">I confirm replacement of accepted and manual duties.</label><p id="dialogMessage" role="status" hidden></p><div class="toolbar form-actions"><button id="confirmPlanning" type="submit">Confirm</button><button id="cancelPlanning" type="button" class="secondary">Cancel</button></div></form></dialog></main></div>
<script src="../../assets/js/api.js?v=20261018-full1"></script><script src="../../engine.js?v=1"></script><script src="../../planning-engine.js?v=20261018-full1"></script><script src="../../runtime.js?v=20261018-full1"></script><script src="../../assets/js/app-ui.js?v=20261018-full1"></script><script src="../../assets/js/guard.js?v=20261018-full1"></script><script src="../../assets/js/planning.js?v=20261018-full1"></script></body></html>
