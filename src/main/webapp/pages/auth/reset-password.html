<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body class="auth-body">
<main class="auth-card">
    <h1>Reset password</h1>
    <p class="muted">Use at least 8 characters with uppercase, lowercase and a number.</p>
    <form id="resetForm" class="stack-form">
        <label>New password<input id="password" type="password" required></label>
        <label>Confirm password<input id="confirmPassword" type="password" required></label>
        <p id="message" class="form-message"></p>
        <button type="submit">Reset password</button>
    </form>
</main>
<script src="../../assets/js/api.js"></script>
<script>
document.getElementById('resetForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const message = document.getElementById('message');
    const password = document.getElementById('password').value;
    if (password !== document.getElementById('confirmPassword').value) {
        message.textContent = 'Passwords do not match';
        return;
    }
    try {
        await apiRequest('../../api/auth/reset-password', {
            method: 'POST',
            body: formBody({
                username: sessionStorage.getItem('resetUsername'),
                email: sessionStorage.getItem('resetEmail'),
                password
            })
        });
        sessionStorage.removeItem('resetUsername');
        sessionStorage.removeItem('resetEmail');
        message.classList.add('success');
        message.innerHTML = 'Password changed. <a href="../../index.html">Return to login</a>';
    } catch (error) {
        message.textContent = error.message;
    }
});
</script>
</body>
</html>
